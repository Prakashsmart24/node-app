<mat-accordion>
  @for (post of postListData(); track $index) {
    <mat-expansion-panel (opened)="panelOpenState.set(true)" (closed)="panelOpenState.set(false)">
      <mat-expansion-panel-header>
        <mat-panel-title> {{ post.title }} </mat-panel-title>
        <mat-panel-description> </mat-panel-description>
      </mat-expansion-panel-header>
      <p>{{ post.content }}</p>
      <mat-action-row>
        <button matButton [routerLink]="['/edit',post.id]">Edit</button>
        <button matButton (click)="onDeletePost(post)">Delete</button>
      </mat-action-row>
    </mat-expansion-panel>
  } @empty {
    <mat-expansion-panel disabled>
      <mat-expansion-panel-header>
        <mat-panel-title> No Post Available </mat-panel-title>
      </mat-expansion-panel-header>
    </mat-expansion-panel>
  }
</mat-accordion>
